apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clone the code repository to the workspace.
  params:
    - name: url
      type: string
      description: git url to clone
      default: ""
    - name: revision
      type: string
      description: git branch to checkout
      default: "main"
  workspaces:
    - name: source
      description: The git repo will be cloned onto the volume backing this workspace
    - name: ssh-directory
      description: A .ssh directory with private key, known_hosts, config, etc.
      optional: true
  results:
    - name: commit
      description: The git commit SHA
  steps:
    - name: git-clone
      image: uhub.service.ucloud.cn/xinxin-istio/git:v2.45.2
      env:
        - name: HOME
          value: /tekton/home
      script: |
        set -eu

        # Setup SSH if ssh-directory workspace is provided
        if [ "$(workspaces.ssh-directory.bound)" == "true" ] ; then
          cp -R "$(workspaces.ssh-directory.path)" "$HOME"/.ssh
          chmod 700 "$HOME"/.ssh
          chmod -R 400 "$HOME"/.ssh/*

          # Add GitHub to known_hosts if not present
          ssh-keyscan github.com >> "$HOME"/.ssh/known_hosts 2>/dev/null || true
        fi

        # Convert HTTPS URL to SSH URL if needed
        GIT_URL="$(params.url)"
        if [[ "$GIT_URL" == https://github.com/* ]]; then
          GIT_URL=$(echo "$GIT_URL" | sed 's|https://github.com/|git@github.com:|')
        fi

        # Clone the repository
        git clone -b $(params.revision) -v "$GIT_URL" $(workspaces.source.path)/source

        # Get the commit SHA
        cd $(workspaces.source.path)/source
        git rev-parse HEAD | tr -d '\n' | tee $(results.commit.path)
