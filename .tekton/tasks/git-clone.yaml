apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clone the code repository to the workspace.
  params:
    - name: url
      type: string
      description: git url to clone
      default: ""
    - name: revision
      type: string
      description: git branch to checkout
      default: "main"
  workspaces:
    - name: source
      description: The git repo will be cloned onto the volume backing this workspace
    - name: ssh-directory
      description: A .ssh directory with private key, known_hosts, config, etc.
      optional: true
  results:
    - name: commit
      description: The git commit SHA
  steps:
    - name: git-clone
      image: uhub.service.ucloud.cn/xinxin-istio/git:v2.45.2
      env:
        - name: HOME
          value: /tekton/home
        - name: GIT_SSH_COMMAND
          value: "ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o BatchMode=yes"
      script: |
        set -eu
        git clone $(params.url) $(workspaces.source.path)/source
        cd $(workspaces.source.path)/source
        git checkout $(params.revision)
        echo "::set-output name=commit::$(git rev-parse HEAD)"
