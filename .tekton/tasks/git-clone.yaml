apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clone the code repository to the workspace.
  params:
    - name: url
      type: string
      description: git url to clone
      default: ""
    - name: revision
      type: string
      description: git branch to checkout
      default: "main"
  workspaces:
    - name: source
      description: The git repo will be cloned onto the volume backing this workspace
    - name: ssh-directory
      description: A .ssh directory with private key, known_hosts, config, etc.
      optional: true
  results:
    - name: commit
      description: The git commit SHA
  steps:
    - name: git-clone
      image: uhub.service.ucloud.cn/xinxin-istio/git:v2.45.2
      env:
        - name: HOME
          value: /tekton/home
        - name: GIT_SSH_COMMAND
          value: "ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o BatchMode=yes"
      script: |
        set -eu

        # Create home directory
        mkdir -p "$HOME"

        # Setup SSH if ssh-directory workspace is provided
        if [ "$(workspaces.ssh-directory.bound)" == "true" ] ; then
          echo "Setting up SSH credentials..."
          cp -R "$(workspaces.ssh-directory.path)" "$HOME"/.ssh
          chmod 700 "$HOME"/.ssh
          chmod -R 400 "$HOME"/.ssh/*

          # Create SSH config to disable host key checking
          cat > "$HOME"/.ssh/config << EOF
Host *
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    BatchMode yes
    LogLevel ERROR
EOF
          chmod 600 "$HOME"/.ssh/config

          echo "SSH setup completed"
        else
          echo "No SSH workspace provided, using HTTPS"
        fi

        # Convert HTTPS URL to SSH URL if SSH is configured
        GIT_URL="$(params.url)"
        if [ "$(workspaces.ssh-directory.bound)" == "true" ] ; then
          if [[ "$GIT_URL" == https://github.com/* ]]; then
            GIT_URL=$(echo "$GIT_URL" | sed 's|https://github.com/|git@github.com:|')
            echo "Converted to SSH URL: $GIT_URL"
          elif [[ "$GIT_URL" == https://gitlab.com/* ]]; then
            GIT_URL=$(echo "$GIT_URL" | sed 's|https://gitlab.com/|git@gitlab.com:|')
            echo "Converted to SSH URL: $GIT_URL"
          fi
        fi

        echo "Cloning repository: $GIT_URL"
        echo "Branch/Revision: $(params.revision)"

        # Clone the repository
        git clone -b $(params.revision) -v "$GIT_URL" $(workspaces.source.path)/source

        # Get the commit SHA
        cd $(workspaces.source.path)/source
        git rev-parse HEAD | tr -d '\n' | tee $(results.commit.path)

        echo "Clone completed successfully"
